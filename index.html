.count{min-width:54px;text-align:center;color:#eadff0;font-weight:700}
.hint{font-size:12px;color:#88798e;line-height:1.7;margin-top:12px}

.question:focus{border-color:#8d68a2}

  position:relative;overflow:hidden;

.result-card:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 90% 0,#694b791c,transparent 35%);

.position{color:#a989b7;font-size:13px;margin-bottom:8px}
.card-title{font-size:22px;font-weight:700}
.meta{color:#9f8ea7;font-size:12px;margin-top:5px}
.orientation{

</div>

const SPREADS = {"single": {"name": "单牌", "positions": ["当前指引"]}, "three": {"name": "时间三牌", "positions": ["过去", "现在", "未来"]}, "relation": {"name": "关系三牌", "positions": ["我的状态", "对方 / 关系能量", "关系走向"]}, "decision": {"name": "选择五牌", "positions": ["现状", "选项 A", "选项 B", "隐藏因素", "建议"]}, "celtic": {"name": "凯尔特十字", "positions": ["现状", "阻碍", "根源", "过去", "可能的未来", "近期发展", "自我状态", "外部环境", "希望与恐惧", "最终趋势"]}};

const state={spreadKey:"three",count:3,result:[]};
const $=id=>document.getElementById(id);

function renderSpreads(){
  const box=$("spreadChips");
  box.innerHTML="";
  Object.entries(SPREADS).forEach(([key,s])=>{
    const b=document.createElement("button");
    b.className="chip"+(key===state.spreadKey?" active":"");
    b.textContent=s.name;
    b.onclick=()=>{
      state.spreadKey=key;
      state.count=s.positions.length;
      $("countRange").value=state.count;
      $("countText").textContent=state.count+" 张";
      renderSpreads();
    };
    box.appendChild(b);
  });
}
$("countRange").addEventListener("input",e=>{
  state.count=Number(e.target.value);
  state.spreadKey="custom";
  $("countText").textContent=state.count+" 张";
  renderSpreads();
});
function shufflePick(n){
  const pool=[...CARDS], out=[];
  for(let i=0;i<n;i++){
    const idx=Math.floor(Math.random()*pool.length);
    const card=pool.splice(idx,1)[0];
    const reversed=Math.random()<.5;
    out.push({...card,reversed,orientation:reversed?"逆位":"正位",meaning:reversed?card.reversed:card.upright});
  }
  return out;
}
function getSpread(){
  if(state.spreadKey==="custom"){
    return {name:"自定义抽牌",positions:Array.from({length:state.count},(_,i)=>"第"+(i+1)+"张")};
  }
  return SPREADS[state.spreadKey];
}
function makeSummary(cards,spread,question){
  const up=cards.filter(c=>!c.reversed).length, rev=cards.length-up;
  let text=`本次共抽到 ${cards.length} 张牌，其中正位 ${up} 张、逆位 ${rev} 张。`;
  if(question.trim()) text+=` 你提出的主题是：“${question.trim()}”。`;
  text+=" 你可以把每张牌的关键词与对应位置结合起来观察，而不是把单张牌当成绝对预言。";
  return text;
}
function showResult(){
  const spread=getSpread(), question=$("question").value;
  state.result=shufflePick(state.count);
  $("resultTitle").textContent=spread.name;
  $("resultQuestion").textContent=question.trim()?`问题：${question.trim()}`:"愿你从牌面里找到值得思考的角度";
  const box=$("cards"); box.innerHTML="";
  state.result.forEach((c,i)=>{
    const el=document.createElement("article");
    el.className="result-card";
    const position=spread.positions[i]||("第"+(i+1)+"张");
    el.innerHTML=`
      <div class="position">${position}</div>
      <div class="card-title">${c.number?c.number+" ":""}${c.name}</div>
      <div class="meta">${c.arcana}</div>
      <span class="orientation">${c.orientation}</span>
      <div class="meaning">${c.meaning}</div>`;
    box.appendChild(el);
  });
  $("summary").textContent=makeSummary(state.result,spread,question);
  $("setup").classList.add("hidden");
  $("result").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
  localStorage.setItem("tarot-last",JSON.stringify({state,question}));
}
function reset(){
  $("result").classList.add("hidden");
  $("setup").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}
$("drawBtn").onclick=showResult;
$("againBtn").onclick=showResult;
$("backBtn").onclick=reset;
$("shareBtn").onclick=async()=>{
  const spread=getSpread(), q=$("question").value.trim();
  const lines=state.result.map((c,i)=>`${spread.positions[i]||"第"+(i+1)+"张"}：${c.name}（${c.orientation}）`);
  const text=`月隐塔罗｜${spread.name}\n${q?`问题：${q}\n`:""}${lines.join("\n")}`;
  try{await navigator.clipboard.writeText(text);$("shareBtn").textContent="已复制";setTimeout(()=>$("shareBtn").textContent="复制结果",1400)}
  catch(e){prompt("复制以下结果：",text)}
};
renderSpreads();
